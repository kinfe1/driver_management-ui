<ng-container *ngIf="auth.isAuthenticated(); else authLayout">
  
  <!-- Global Loading Spinner -->
  <div
    class="global-loading"
    *ngIf="loadingService.loading$ | async"
  >
    <div class="dots-loader">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
  
  <div class="app-shell" [class.nav-open]="isNavOpen">
    <aside class="side-nav" [class.open]="isNavOpen" id="side-nav" [attr.aria-hidden]="!isNavOpen">
      <div class="side-top">
        <div class="brand">
          <div class="logo">ET</div>
          <div>
            <h1>ET-Richmond Taxi</h1>
            <p>Driver management</p>
          </div>
        </div>
      </div>

      <nav>
        <a *ngFor="let item of filteredNavItems"
           routerLink="{{ item.route }}"
           routerLinkActive="active"
           [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
           (click)="closeNav()">
          <span class="nav-icon" aria-hidden="true"><i [class]="item.icon || 'fa-solid fa-circle'"></i></span>
          <span>{{ item.label }}</span>
        </a>
      </nav>
    </aside>

    <div class="backdrop" *ngIf="isNavOpen" (click)="closeNav()" aria-hidden="true"></div>

    <main class="content-area">
      <header class="topbar">
        <div class="topbar-row">

          <div class="top-actions">
            <button class="mobile-menu" type="button" (click)="toggleNav()" aria-label="Open navigation" aria-controls="side-nav" [attr.aria-expanded]="isNavOpen">☰</button>

            <form class="search-bar" role="search" aria-label="Search ET-Richmond data">
              <label class="sr-only" for="search-input">Search drivers, vehicles, assignments</label>
              <input id="search-input" type="search" class="main-search" placeholder="Search ET-Richmond data" />
            </form>
          </div>

          <div class="top-actions">

            <button class="icon-btn notf-button" aria-label="Notifications">
              <span class="notf">Notifications</span>
              <i class="fa-solid fa-bell"></i>
            </button>

            <div class="profile-wrapper" (clickOutside)="closeProfileMenu()">
              <button
                class="profile-btn"
                type="button"
                aria-label="Open profile menu"
                [attr.aria-expanded]="showProfileMenu"
                (click)="toggleProfileMenu()">

                <img
                  class="profile-image"
                  [src]="userImage"
                  alt="{{ lastNameInitial }}" />

                <div class="profile-info">
                  <span class="role">{{ role }}</span>
                  <span class="profile-name">{{ firstName }}</span>
                </div>

                <i
                  class="fa-solid fa-chevron-down profile-chevron"
                  [class.rotate]="showProfileMenu">
                </i>
              </button>

              <div class="profile-dropdown" *ngIf="showProfileMenu">

                <div class="profile-dropdown-header">
                  <img
                    class="profile-dropdown-image"
                    [src]="userImage"
                    alt="{{ lastNameInitial }}" />

                  <div>
                    <strong>{{ name }}</strong>
                    <span>{{ role }}</span>
                  </div>
                </div>

                <div class="profile-dropdown-divider"></div>

                <button
                  type="button"
                  class="dropdown-item logout-item"
                  (click)="logout()">

                  <i class="fa-solid fa-right-from-bracket"></i>
                  <span>Logout</span>

                </button>

              </div>
            </div>

          </div>
        </div>
      </header>

      <section class="page-content">
        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</ng-container>

<ng-template #authLayout>
  <router-outlet></router-outlet>
</ng-template>
